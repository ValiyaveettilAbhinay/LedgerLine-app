services:

  postgres:
    image: postgres:18
    container_name: ledgerline-db

    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Abhi7771@

    ports:
      - "5433:5432"

    volumes:
      - ledgerline_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  backend:
    build: .
    container_name: ledgerline-backend

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledgerline
      SPRING_DATASOURCE_USERNAME: $postgres
      SPRING_DATASOURCE_PASSWORD: $Abhi7771@
      JWT_SECRET: $b9FUdx+I0+4ZEsCZAqaqJ/6upw8zSU6w0PlecqP8nug=

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


volumes:
  ledgerline_postgres_data: